# The relay behind nginx, at the root of its own (sub)domain or under a path
# prefix. WebSockets need the Upgrade headers and long read timeouts.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

server {
	listen 443 ssl;
	http2 on;
	server_name share.example.com;
	# ssl_certificate / ssl_certificate_key ...

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 1h;
		proxy_send_timeout 1h;
		proxy_buffering off;
	}

	# Alternatively, under a prefix on a shared host (the prefix is stripped):
	# location /herdr-share/ {
	#	proxy_pass http://127.0.0.1:8080/;
	#	... same headers and timeouts as above ...
	# }
}
