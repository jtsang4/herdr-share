name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Relay (server / container image)
        - Bridge / CLI (herdr-share)
        - Herdr mod (Share dialog)
        - Guest web page
        - Installation
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: herdr-share version
      description: Output of `herdr-share version`
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. macOS 26 arm64, Ubuntu 24.04 amd64, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The share's bridge log (`herdr-share status <share> --json` shows its log_file) or the relay's logs. Remove share links, keys and tokens.
      render: text
